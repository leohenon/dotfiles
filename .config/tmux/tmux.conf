unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -g default-shell "/opt/homebrew/bin/fish"
set -ag terminal-features ",xterm-ghostty:RGB"
set -ag terminal-features ",xterm-ghostty:extkeys"

set -g copy-mode-selection-style "reverse"
set -sg escape-time 0
set -g mouse on
set -g focus-events on

setw -g mode-keys vi

bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-pipe

# Execute the selection in a right-hand split, keeping the shell open.
bind-key -T copy-mode-vi x send-keys -X copy-pipe-and-cancel 'sh ~/.config/tmux/scripts/run-copy-selection.sh #{q:pane_id} #{q:pane_current_path}'

# Keep o for selection ends; Shift-o opens web links or files in a new Neovim window.
bind-key -T copy-mode-vi o send-keys -X other-end
bind-key -T copy-mode-vi O run-shell 'link=#{q:copy_cursor_hyperlink}; word=#{q:copy_cursor_word}; text=#{q:copy_cursor_line}; x=#{q:copy_cursor_x}; python3 ~/.config/tmux/scripts/open-copy-target.py "$link" "$word" #{q:pane_current_path} #{q:session_id} "$text" "$x" #{q:pane_id} #{q:copy_cursor_y} #{q:scroll_position}'
bind-key -T copy-mode    O run-shell 'link=#{q:copy_cursor_hyperlink}; word=#{q:copy_cursor_word}; text=#{q:copy_cursor_line}; x=#{q:copy_cursor_x}; python3 ~/.config/tmux/scripts/open-copy-target.py "$link" "$word" #{q:pane_current_path} #{q:session_id} "$text" "$x" #{q:pane_id} #{q:copy_cursor_y} #{q:scroll_position}'

# Jump to the nearest link on this line; repeat at a link start to cycle.
bind-key -T copy-mode-vi C-l run-shell 'python3 ~/.config/tmux/scripts/jump-copy-link.py #{q:pane_id} #{q:copy_cursor_line} #{q:copy_cursor_x} #{q:copy_cursor_y} #{q:scroll_position}'

# Copy-mode prompts on the status line instead of in the pane (default
# bindings gained -P, a pane prompt, in the tmux 3.8 prompt rework).
bind -T copy-mode-vi / command-prompt -T search -p'(search down)' { send -X search-forward -- '%%' }
bind -T copy-mode-vi ? command-prompt -T search -p'(search up)' { send -X search-backward -- '%%' }
bind -T copy-mode-vi : command-prompt -p'(goto line)' { send -X goto-line -- '%%' }
bind -T copy-mode-vi f command-prompt -1p'(jump forward)' { send -X jump-forward -- '%%' }
bind -T copy-mode-vi F command-prompt -1p'(jump backward)' { send -X jump-backward -- '%%' }
bind -T copy-mode-vi t command-prompt -1p'(jump to forward)' { send -X jump-to-forward -- '%%' }
bind -T copy-mode-vi T command-prompt -1p'(jump to backward)' { send -X jump-to-backward -- '%%' }
bind -T copy-mode-vi 1 command-prompt -Np'(repeat)' -I1 { send -N '%%' }
bind -T copy-mode-vi 2 command-prompt -Np'(repeat)' -I2 { send -N '%%' }
bind -T copy-mode-vi 3 command-prompt -Np'(repeat)' -I3 { send -N '%%' }
bind -T copy-mode-vi 4 command-prompt -Np'(repeat)' -I4 { send -N '%%' }
bind -T copy-mode-vi 5 command-prompt -Np'(repeat)' -I5 { send -N '%%' }
bind -T copy-mode-vi 6 command-prompt -Np'(repeat)' -I6 { send -N '%%' }
bind -T copy-mode-vi 7 command-prompt -Np'(repeat)' -I7 { send -N '%%' }
bind -T copy-mode-vi 8 command-prompt -Np'(repeat)' -I8 { send -N '%%' }
bind -T copy-mode-vi 9 command-prompt -Np'(repeat)' -I9 { send -N '%%' }

unbind h
unbind j
unbind k
bind l last-window
bind L switch-client -l
unbind -n C-l
unbind c

unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l

bind M-h resize-pane -L 20
bind M-j resize-pane -D 20
bind M-k resize-pane -U 20
bind M-l resize-pane -R 20

bind -n C-j if-shell -F "#{m:*nvim*,#{pane_current_command}}" "send-keys C-j" "send-keys Down"
bind -n C-k if-shell -F "#{m:*nvim*,#{pane_current_command}}" "send-keys C-k" "send-keys Up"

# Smart C-w h/j/k/l navigation between Neovim windows and tmux panes.
# In Neovim, pass C-w through so vim-tmux-navigator handles the full sequence.
# In other panes, C-w enters this tmux key table for pane movement.
bind-key -n C-w if-shell -F "#{m/r:^(g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?)$,#{pane_current_command}}" "send-keys C-w" "switch-client -T vim-tmux-navigator"
bind-key -T vim-tmux-navigator h select-pane -L
bind-key -T vim-tmux-navigator j select-pane -D
bind-key -T vim-tmux-navigator k select-pane -U
bind-key -T vim-tmux-navigator l select-pane -R
bind-key -T vim-tmux-navigator \\ select-pane -l

bind -n C-p previous-window
bind -n C-n next-window

# Prefix 9 selects the highest-numbered (last) window, not window index 9.
bind 9 select-window -t :$

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -p 25 -c "#{pane_current_path}"
bind \\ split-window -h -p 33 -c "#{pane_current_path}"

bind X confirm-before -p "Close all other panes? (y/n)" "kill-pane -a"

# Vim-like tmux command prompt shortcuts.
set -s command-alias[50] 'q=kill-pane'
set -s command-alias[51] 'qa=run-shell "sh ~/.config/tmux/scripts/kill-current-session.sh"'

bind c if-shell -F "#{==:#{session_windows},1}" \
  "new-window -n scratch -c \"#{pane_current_path}\" \; set -w automatic-rename off \; set -w allow-rename off" \
  "if-shell -F \"#{==:#{session_windows},2}\" \
    \"new-window -n pi -c \\\"#{pane_current_path}\\\" \\; set -w automatic-rename off \\; set -w allow-rename off\" \
    \"new-window -n fish -c \\\"#{pane_current_path}\\\" \\; set -w automatic-rename off \\; set -w allow-rename off\""

bind , command-prompt -p "Rename window:" "rename-window '%%'"

bind d detach-client
bind K confirm-before -p "Kill session #S? (y/n)" "run-shell 'sh ~/.config/tmux/scripts/kill-current-session.sh'"
bind p previous-window
unbind m
unbind M
bind m select-pane -m
bind M if-shell -F "#{pane_marked_set}" "switch-client -t '{marked}' \; select-window -t '{marked}' \; select-pane -t '{marked}'" "display-message 'No marked pane'"
bind ';' select-pane -l

unbind <
unbind >
bind < swap-window -d -t :-1
bind > swap-window -d -t :+1

bind Q choose-tree -w
bind e choose-tree -s

bind N command-prompt -p "New ~/dev session:" "run-shell '~/.config/tmux/scripts/new-dev-session.sh \"%1\"'"
bind C command-prompt -p "Clone repo:" "run-shell '~/.config/tmux/scripts/clone-dev-session.sh \"%1\"'"
bind S command-prompt -p "New session:" "new-session -s '%%'"

# Universal paths: reuse an idle shell or Neovim, otherwise open a new window.
# run-shell expands pane/client formats before display-popup starts its shell.
bind C-d run-shell 'tmux display-popup -c #{q:client_name} -E -w 75% -h 70% -d #{q:pane_current_path} "python3 ~/.config/tmux/scripts/path-picker.py dir #{pane_id}"'
bind C-f run-shell 'tmux display-popup -c #{q:client_name} -E -w 75% -h 70% -d #{q:pane_current_path} "python3 ~/.config/tmux/scripts/path-picker.py file #{pane_id}"'

bind f if-shell "command -v fzf >/dev/null 2>&1" \
  "display-popup -E -w 62% -h 38% -S \"fg=colour241\" '~/.config/tmux/scripts/tmux-session-popup.sh'" \
  "display-message 'fzf not found'"

bind s if-shell "command -v fzf >/dev/null 2>&1" \
  "display-popup -E -w 62% -h 38% -S \"fg=colour241\" 'tmux list-sessions -F \"#S\" | fzf --prompt=\"session> \" --height=100% --layout=default --no-scrollbar | xargs -I {} tmux switch-client -t \"{}\"'" \
  "display-message 'fzf not found'"

unbind F

bind J command-prompt -p "Join to pane id (e.g. %2):" "join-pane -t '%%'"
bind V command-prompt -p "Vertical join:" "run-shell '~/.config/tmux/scripts/join-pane-right.sh #{pane_id} %1'"

bind v copy-mode
bind [ copy-mode
bind PPage copy-mode -u
unbind O

bind r source-file ~/.config/tmux/tmux.conf \;\
       set -g status on \;\
       set -g status-position bottom\;\
       refresh-client -S \;\
       display-message "tmux reloaded"

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g base-index 1
set -g renumber-windows on
set -g set-titles off
setw -g allow-rename off
setw -g automatic-rename off

set-hook -g after-new-session "rename-window -t :1 nvim"

set -g status-style "bg=#161616,fg=#FEFEFE"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#A0A0A0"

set -g status-left-length 50
set -g status-right-length 50
set -g window-status-separator ""
set -g window-status-style "bg=default,fg=#FEFEFE"
set -g window-status-current-style "bg=default,fg=#FEFEFE"
set -g pane-active-border-style "fg=#FFCFA8"
set -g message-style "fg=#101010,bg=#FFCFA8,align=centre"
set -g message-command-style "fg=#101010,bg=#FFCFA8,align=centre"
set -g mode-style "fg=#101010,bg=#FFCFA8,bold"

set -g status-left "#[bg=#161616,fg=#FEFEFE] [#S] "
setw -g window-status-format "#[bg=#161616,fg=#FEFEFE] #I:#{?pane_in_mode,[#W],#W}#{window_flags} "
setw -g window-status-current-format "#[bg=#161616,fg=#FEFEFE] #I:#{?pane_in_mode,[#W],#W}#{window_flags} "
set -g status-right '#[bg=#161616,fg=#FEFEFE] "#{=|-36|...:#{s|/Users/leohenon|~|:pane_current_path}}" #[bg=#161616,fg=#FEFEFE] %I:%M %p '
setw -g copy-mode-current-line-style "bg=#2a2a2a"
setw -g copy-mode-line-numbers relative
set -g copy-mode-line-number-style "fg=colour243"
setw -g copy-mode-current-line-number-style "fg=#FFCFA8,bold"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'leohenon/tmux-grip'
set -g @plugin 'leohenon/tmux-palette'

# Use the local Ollama server for tmux-llm (no API key required).
set -g @tmux-llm-api-endpoint 'http://127.0.0.1:11434/v1/chat/completions'
set -g @tmux-llm-model 'qwen3:14b'
set -g @tmux-llm-key 'M-g'

# Local tmux-llm checkout for live testing.
run-shell '/Users/leohenon/dev/tmux-llm/plugin.tmux'
set -g @tmux-tab-bind 'Tab'
set -g @tmux-tab-color '#FFC799'
set -g @tmux-tab-text-color '#000000'
set -g @tmux-tab-max-tabs '10'
set -g @tmux-tab-cycle-bind 'n'
set -g @tmux-tab-cycle-prev-bind 'p'
set -g @tmux-tab-cycle-prefix 'on'
set -g @tmux-tab-cycle-timeout '2'
set -g @tmux-tab-cycle-bind 'n'
set -g @tmux-tab-cycle-prev-bind 'p'
set -g @tmux-tab-cycle-prefix 'on'
set -g @tmux-tab-cycle-timeout '2'
# local tmux-tab checkout for live testing
run-shell '/Users/leohenon/dev/tmux-tab/tmux-tab.tmux'
# local tmux-lair checkout for live testing
# set -g @lair_bind_open 'a'
# run-shell '/Users/leohenon/dev/tmux-lair/lair.tmux'

set -g @tmux_grip_max_slots 4
set -g @tmux_grip_bind_open 'g'
set -g @tmux_grip_enable_slot_binds 'on'
set -g @tmux_grip_bind_slot_1 'y'
set -g @tmux_grip_bind_slot_2 'u'
set -g @tmux_grip_bind_slot_3 'i'
set -g @tmux_grip_bind_slot_4 'o'

run '~/.config/tmux/plugins/tpm/tpm'
unbind -q -n C-h
unbind -q -n C-S-h

set -s extended-keys always
set -s extended-keys-format csi-u
